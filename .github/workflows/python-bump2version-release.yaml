name: Manage version of Python package

on:
  workflow_call:
    outputs:
      development_version:
        value: ${{ jobs.increase-version.outputs.development_version }}
      release_version:
        value: ${{ jobs.increase-version.outputs.release_version }}
      pr_version:
        value: ${{ jobs.increase-version.outputs.pr_version }}
    secrets:
      TWINE_USERNAME:
        required: true
      TWINE_PASSWORD:
        required: true

jobs:
  increase-version-dev:
    name: Increase version dev
    outputs:
      development_version: ${{ steps.dev_version.outputs.DEV_VERSION }}
      release_version: ${{ steps.release_version.outputs.RELEASE_VERSION }}
      pr_version: ${{ steps.pr_version.outputs.PR_VERSION }}
    runs-on: gha-ss-airflow-preprod-org-runners
    steps:

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Setup Python version
        uses: actions/setup-python@v4
        with:
          python-version: "3.7"

  build-and-publish-dev:
    needs: [increase-version-dev]
    uses: pepsico-ecommerce/data-platform-reusable/.github/workflows/build-push.yml@main
    with:
      repository_url: 'https://pepecomm.pe.jfrog.io/artifactory/api/pypi/pypi-dev/'
    secrets:
      UV_INDEX_JFROG_USERNAME: ${{ secrets.UV_INDEX_JFROG_USERNAME }}
      UV_INDEX_JFROG_PASSWORD: ${{ secrets.UV_INDEX_JFROG_PASSWORD }}
