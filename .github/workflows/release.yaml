# This workflow will upload the package to Nexus Artifactory using Twine

name: release

on:
  release:
    types: [published]

defaults:
  run:
    shell: bash


# Parallelize jobs that can be for this workflow/ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-py-package:
    uses: pepsico-ecommerce/data-platform-reusable/.github/workflows/build-push.yml@main
    with:
      repository_url: 'https://pepecomm.pe.jfrog.io/artifactory/api/pypi/pypi-release/'
    secrets:
      UV_INDEX_JFROG_USERNAME: ${{ secrets.UV_INDEX_JFROG_USERNAME }}
      UV_INDEX_JFROG_PASSWORD: ${{ secrets.UV_INDEX_JFROG_PASSWORD }}
